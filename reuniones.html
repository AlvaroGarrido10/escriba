<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Escriba — Reuniones</title>
<link rel="icon" href="icon32.png">
<link rel="stylesheet" href="reuniones.css">
</head>
<body>
<header class="barra">
  <div class="marca"><img src="icon32.png" alt=""><b>Escriba</b><span>Reuniones</span></div>
  <div class="busca">
    <input id="buscar" type="search" placeholder="Buscar en todas las reuniones: título, nombres, lo que se dijo…" autocomplete="off">
  </div>
  <div class="enlaces">
    <button id="btnImportar" class="fantasma" title="Transcribir una grabación que ya tienes">📂 Transcribir archivo</button>
    <button id="btnOpciones" class="fantasma">⚙️ Opciones</button>
  </div>
</header>

<div class="cuerpo">
  <aside id="lista" aria-label="Reuniones"></aside>

  <main id="vista">
    <div id="vacio" class="vacio">
      <img src="icon128.png" alt="">
      <h2>Tus reuniones, listas para aprovechar</h2>
      <p>Elige una a la izquierda para leerla, poner nombre a cada voz, sacar el acta o preguntarle cualquier cosa.</p>
    </div>

    <article id="reunion" hidden>
      <div class="cab">
        <input id="titulo" class="titulo" maxlength="160" aria-label="Título de la reunión" title="Pulsa para cambiar el título">
        <div id="meta" class="meta"></div>
        <label class="participantes">👥
          <input id="participantes" maxlength="400" placeholder="Participantes (opcional): ayuda al acta y a poner nombre a cada voz">
        </label>
        <div id="aviso" class="aviso" hidden></div>
        <div class="acciones">
          <button id="btnCopiar">📋 Copiar</button>
          <div class="menu">
            <button id="btnExportar">⬇️ Exportar ▾</button>
            <div id="menuExportar" class="desplegable" hidden>
              <button data-fmt="docx">📄 Word (.docx)</button>
              <button data-fmt="pdf">🖨️ PDF (imprimir)</button>
              <button data-fmt="md">📝 Markdown (.md)</button>
              <button data-fmt="txt">🗒️ Texto (.txt)</button>
              <button data-fmt="srt">🎬 Subtítulos (.srt)</button>
            </div>
          </div>
          <button id="btnReintentar" hidden>🔄 Reintentar ahora</button>
          <button id="btnBorrar" class="peligro">🗑 Borrar</button>
        </div>
        <div id="confirmaBorrar" class="aviso err" hidden></div>
      </div>

      <nav class="pestanas" role="tablist">
        <button role="tab" data-p="texto" class="activa">Transcripción</button>
        <button role="tab" data-p="acta">Acta y resúmenes</button>
        <button role="tab" data-p="preguntar">Preguntar</button>
      </nav>

      <section id="p-texto" class="panel">
        <div class="herramientas">
          <input id="buscarEn" type="search" placeholder="🔍 Buscar en esta reunión" autocomplete="off">
          <span id="nCoinc" class="suave"></span>
        </div>
        <details id="notasBox" class="notas">
          <summary>📝 Notas y momentos marcados <span id="notasResumen" class="suave"></span></summary>
          <textarea id="notas" placeholder="Tus notas de esta reunión: salen en el .md y el acta las tiene en cuenta."></textarea>
          <div id="marcasLista" class="chips"></div>
        </details>
        <div id="hablantes" class="hablantes"></div>
        <div id="texto" class="transcripcion"></div>
      </section>

      <section id="p-acta" class="panel" hidden>
        <div class="herramientas">
          <select id="plantilla" aria-label="Plantilla"></select>
          <select id="provActa" aria-label="Proveedor"></select>
          <button id="btnGenerar" class="principal">✨ Generar</button>
          <span id="estadoActa" class="suave"></span>
        </div>
        <div id="actas" class="chips"></div>
        <div id="actaVista" class="md"></div>
        <div id="accionesActa" class="acciones" hidden>
          <button id="actaCopiar">📋 Copiar</button>
          <button id="actaCorreo" title="Copia con formato para pegar en Outlook, Gmail o Teams">✉️ Copiar para correo</button>
          <button id="actaWord">📄 Word</button>
          <button id="actaMd">📝 .md</button>
          <button id="actaImprimir">🖨️ PDF</button>
        </div>
      </section>

      <section id="p-preguntar" class="panel" hidden>
        <div id="chat" class="chat"></div>
        <div class="sugerencias" id="sugerencias">
          <button>¿Qué se decidió?</button>
          <button>¿Quién tiene tareas pendientes y para cuándo?</button>
          <button>¿Qué dudas quedaron abiertas?</button>
          <button>¿Se habló de plazos o de dinero?</button>
        </div>
        <form id="formPregunta" class="pregunta">
          <input id="pregunta" placeholder="Pregunta lo que quieras sobre esta reunión…" autocomplete="off">
          <select id="provChat" aria-label="Proveedor"></select>
          <button class="principal">Preguntar</button>
        </form>
        <div id="estadoChat" class="suave"></div>
      </section>
    </article>
  </main>
</div>

<script src="config.js"></script>
<script src="comun.js"></script>
<script src="ia.js"></script>
<script src="exportar.js"></script>
<script src="reuniones.js"></script>
</body>
</html>
